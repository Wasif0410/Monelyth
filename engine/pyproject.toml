[project]
name = "monelyth-engine"
version = "0.1.0"
description = "Local engine for Monelyth: imports statements, categorizes transactions and serves the desktop UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3,<0.144",
    "httpx2>=2.13.1,<3",
    "ofxtools>=1.1.1,<1.2",
    "pydantic>=2.14.1,<3",
    "python-multipart>=0.0.32,<0.1",
    "uvicorn>=0.54.0,<0.55",
]

[project.scripts]
monelyth-engine = "monelyth_engine.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3,<7",
    "pyright>=1.1.414,<1.2",
    "pytest>=9.1.1,<10",
    "pytest-socket>=0.8.1,<0.9",
    "ruff>=0.17.1,<0.18",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "S",    # flake8-bandit (security)
  "PT",   # flake8-pytest-style
  "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; subprocess use in tests and build scripts is intentional.
"tests/**" = ["S101", "S603"]
"scripts/**" = ["S603", "S607"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Privacy guard: tests may only talk to this machine. Any accidental call to the
# internet fails the suite.
addopts = "--strict-markers --allow-hosts=127.0.0.1,localhost"
